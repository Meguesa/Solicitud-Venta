name: Publicar cambios relevantes de Solicitud

on:
  push:
    branches:
      - main
    paths:
      - 'src/js/**'
      - 'src/css/**'
      - 'firma/**'
      - 'api/solicitud-venta/**'
      - 'index.php'
      - 'index.html'
      - 'tools/build_solicitud_package.py'
      - 'tools/deploy_solicitud_ftps.sh'
      - '.github/workflows/publicar-solicitud-cpanel.yml'
      - '.github/workflows/publicar-consentimiento-privacidad.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Lanzar despliegue completo de Solicitud
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow canonico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publicar-solicitud-cpanel.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f alcance=completo
          echo "Despliegue completo de Solicitud de Venta solicitado."

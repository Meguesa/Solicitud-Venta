name: Migrar propiedad de Solicitud de Venta a su repo

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply_repo_independence.py'
      - '.github/workflows/migrar-propiedad-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrar-solicitud-repo-ownership
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar desacoplamiento
        run: python3 tools/apply_repo_independence.py

      - name: Validar referencias residuales
        shell: bash
        run: |
          set -euo pipefail
          php_files="$(find . -path './api/solicitud-venta/*.php' -o -path './inicio/*.php' -o -path './vobo/*.php' -o -maxdepth 1 -name '*.php')"
          if grep -nH "includes/bootstrap.php" $php_files; then
            echo 'ERROR: quedan dependencias directas al bootstrap del Portal.'
            exit 1
          fi
          grep -q 'svSolicitudRequireAuthentication' index.php
          grep -q 'svSolicitudVoboRole' inicio/index.php
          grep -q 'svSolicitudRequireVobo' vobo/index.php
          grep -q 'svSolicitudCanVobo' api/solicitud-venta/vobo.php
          grep -q 'svSolicitudCanCobranzaVobo' api/solicitud-venta/vobo-firma.php

      - name: Guardar migracion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Repositorio ya se encontraba migrado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Desacoplar Solicitud de Venta del codigo del Portal'
          git push origin HEAD:main

name: Publicar Solicitud de Venta independiente en cPanel

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-solicitud-cpanel.yml'
  workflow_dispatch:
    inputs:
      alcance:
        description: "Alcance del despliegue"
        required: true
        default: "completo"
        type: choice
        options:
          - interfaz
          - correccion
          - sesion
          - completo

permissions:
  contents: read

concurrency:
  group: solicitud-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.event_name == 'pull_request'
    name: Verificación aislada (sin publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio para auditoría
        uses: actions/checkout@v6
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, curl, openssl, mbstring
          coverage: none
      - name: Validar sintaxis de todo PHP
        shell: bash
        run: |
          set -euo pipefail
          find api vobo -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
      - name: Validar sintaxis de JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find src/js vobo -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Construir paquete (sin FTP ni correos)
        run: python3 tools/build_solicitud_package.py

  deploy:
    if: github.event_name != 'pull_request'
    name: Construir y publicar Solicitud de Venta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar Solicitud de Venta
        uses: actions/checkout@v6

      - name: Validar estructura autonoma del repositorio
        shell: bash
        run: |
          set -euo pipefail
          test -s index.php
          test -s index.html
          test -d src/js
          test -d src/css
          test -s src/js/app.js
          test -s src/js/auth.js
          test -s src/js/config.js
          test -s src/js/persistencia.js
          test -s src/js/firma-remota.js
          test -s src/js/firma-remota-preflight.js
          test -s src/js/correccion.js
          test -s src/js/correccion-validacion.js
          test -s src/js/documentacion.js
          test -s src/js/consentimiento-privacidad.js
          test -s src/css/styles.css
          test -s src/css/wizard.css
          test -s src/css/firma-remota.css
          test -d inicio
          test -d vobo
          test -d api/solicitud-venta
          test -d firma
          test -s api/solicitud-venta/_common.php
          test -s api/solicitud-venta/borrador.php
          test -s api/solicitud-venta/archivos.php
          test -s api/solicitud-venta/validar.php
          test -s api/solicitud-venta/vobo.php
          test -s api/solicitud-venta/firma-remota-publica.php
          test -s api/solicitud-venta/consentimiento-privacidad.php
          test -s api/solicitud-venta/pdf-final.php
          test -s api/solicitud-venta/pdf-preliminar.php
          test -s firma/index.html
          test -s firma/firma.js
          test -s tools/build_solicitud_package.py
          test -s tools/deploy_solicitud_ftps.sh
          test ! -e tools/normalize_runtime.py

          count_php="$(find api/solicitud-venta -maxdepth 1 -type f -name '*.php' | wc -l | tr -d ' ')"
          echo "Endpoints PHP disponibles: ${count_php}"
          if [ "$count_php" -lt 30 ]; then
            echo "ERROR: faltan endpoints del backend de Solicitud de Venta."
            exit 1
          fi

      - name: Construir y validar paquete de produccion
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_solicitud_package.py

      - name: Validar sintaxis JavaScript de la herramienta
        shell: bash
        run: |
          set -euo pipefail
          for script in src/js/app.js src/js/componentes-sync.js src/js/persistencia.js src/js/sucursales-componentes.js src/js/extras.js; do
            node --check "$script"
          done

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, curl, mbstring, fileinfo
          coverage: none

      - name: Validar PHP del paquete
        shell: bash
        run: |
          set -euo pipefail
          find _deploy/api/solicitud-venta _deploy/solicitud-venta _deploy/firma -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Instalar cliente FTPS resiliente
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validar credenciales de publicacion
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}"
          test -n "${FTP_USERNAME:-}"
          test -n "${FTP_PASSWORD:-}"
          echo "Credenciales FTPS presentes."

      - name: Publicar exclusivamente Solicitud de Venta
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SOLICITUD_DEPLOY_SCOPE: ${{ inputs.alcance || 'completo' }}
        run: |
          set -euo pipefail
          cd _deploy
          bash ../tools/deploy_solicitud_ftps.sh
# publicar fix consistencia componentes y VoBo 20261109

name: Migrar backend de Solicitud al repo propio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrar-solicitud-backend
  cancel-in-progress: false

jobs:
  migrate:
    name: Copiar backend y firma desde Portal-Interno-JJP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validar token temporal de migracion
        shell: bash
        env:
          PORTAL_MIGRATION_TOKEN: ${{ secrets.PORTAL_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PORTAL_MIGRATION_TOKEN:-}" ]; then
            echo "ERROR: falta el secret PORTAL_MIGRATION_TOKEN en Solicitud-Venta."
            exit 1
          fi

      - name: Descargar Solicitud de Venta
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Descargar Portal actual como fuente de migracion
        uses: actions/checkout@v6
        with:
          repository: Meguesa/Portal-Interno-JJP
          ref: main
          path: _portal_migracion
          token: ${{ secrets.PORTAL_MIGRATION_TOKEN }}
          persist-credentials: false

      - name: Migrar archivos que pertenecen a Solicitud de Venta
        shell: bash
        run: |
          set -euo pipefail

          test -d _portal_migracion/api/solicitud-venta
          test -d _portal_migracion/firma
          test -s _portal_migracion/scripts/prepare_solicitud_portal_session.py

          rm -rf api/solicitud-venta
          rm -rf firma
          mkdir -p api tools

          cp -a _portal_migracion/api/solicitud-venta api/solicitud-venta
          cp -a _portal_migracion/firma firma
          cp _portal_migracion/scripts/prepare_solicitud_portal_session.py tools/prepare_solicitud_portal_session.py

          rm -rf _portal_migracion

      - name: Validar migracion antes del commit
        shell: bash
        run: |
          set -euo pipefail

          test -s api/solicitud-venta/_common.php
          test -s api/solicitud-venta/borrador.php
          test -s api/solicitud-venta/estado-borrador.php
          test -s api/solicitud-venta/estado-solicitud.php
          test -s api/solicitud-venta/mis-solicitudes.php
          test -s api/solicitud-venta/validar.php
          test -s api/solicitud-venta/vobo.php
          test -s api/solicitud-venta/preparar-firma-remota.php
          test -s api/solicitud-venta/firma-remota-publica.php
          test -s api/solicitud-venta/notificaciones.php
          test -s api/solicitud-venta/notificaciones-flujo.php
          test -s api/solicitud-venta/notificar-cobranza.php
          test -s api/solicitud-venta/sharepoint-grupos.php
          test -s api/solicitud-venta/pdf-final.php
          test -s api/solicitud-venta/pdf-final-lib.php

          test -s firma/index.html
          test -s firma/firma.js
          test -s firma/styles.css
          test -s tools/prepare_solicitud_portal_session.py

          count_php="$(find api/solicitud-venta -maxdepth 1 -type f -name '*.php' | wc -l | tr -d ' ')"
          echo "Endpoints PHP migrados: ${count_php}"
          if [ "$count_php" -lt 30 ]; then
            echo "ERROR: se esperaban al menos 30 archivos PHP de Solicitud de Venta."
            exit 1
          fi

      - name: Guardar migracion en Solicitud-Venta
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api/solicitud-venta firma tools/prepare_solicitud_portal_session.py

          if git diff --cached --quiet; then
            echo "No hay cambios pendientes; la migracion ya estaba aplicada."
            exit 0
          fi

          git commit -m "Migrar backend y firma de Solicitud de Venta al repo propio"
          git push origin HEAD:main

      - name: Resultado
        shell: bash
        run: |
          echo "Solicitud-Venta ya contiene su backend PHP, firma publica y preparador de sesion."
          echo "Despues de validar este run, elimina el secret PORTAL_MIGRATION_TOKEN y este workflow temporal."
